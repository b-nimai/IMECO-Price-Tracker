<!doctype html>
<!-- Dark is pinned on <html> rather than toggled. This is a wall display: there is nobody at
     the screen to flip a theme, and a light surface would wash out the heatmap ramp that the
     whole page exists to carry. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/imeco_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>IMECO Price Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
